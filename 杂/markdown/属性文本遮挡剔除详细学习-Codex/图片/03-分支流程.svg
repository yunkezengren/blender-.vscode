<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-label="update_text_depth 函数分支流程">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10162d"/><stop offset="1" stop-color="#182e52"/></linearGradient><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1 9 5.5 1 10" fill="none" stroke="#9fbce8" stroke-width="2"/></marker></defs><rect width="1200" height="830" fill="url(#bg)"/><text x="58" y="60" fill="white" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="33" font-weight="700">1017–1053：一次调用到底发生什么</text><text x="58" y="94" fill="#adc2e7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17">蓝色为条件，玫红为释放，绿色为当前帧读取</text>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle"><rect x="430" y="135" width="340" height="66" rx="18" fill="#355b9a"/><text x="600" y="175" fill="white" font-size="24" font-weight="700">update_text_depth()</text><rect x="310" y="250" width="580" height="100" rx="20" fill="#284678" stroke="#75a5f8"/><text x="600" y="290" fill="white" font-size="20" font-weight="700">显示文字？3D 视图？至少一条文字请求测试？</text><text x="600" y="321" fill="#bfd6ff" font-size="16">任一条件不满足 → 左侧；全部满足 → 右侧</text>
<rect x="65" y="425" width="440" height="139" rx="20" fill="#633850" stroke="#db789c"/><text x="285" y="464" fill="white" font-size="21" font-weight="700">无需深度</text><text x="285" y="501" fill="#ffd9e7" font-size="18">清除 DRWTextStore 借用指针</text><text x="285" y="531" fill="#ffd9e7" font-size="18">释放旧 ViewDepths → return</text>
<rect x="695" y="425" width="440" height="139" rx="20" fill="#2b5167" stroke="#77bdd8"/><text x="915" y="464" fill="white" font-size="21" font-weight="700">需要深度</text><text x="915" y="501" fill="#c7efff" font-size="18">查 ARegion 的 GPUViewport</text><text x="915" y="531" fill="#c7efff" font-size="18">取得 depth_tx 和宽高</text>
<rect x="695" y="610" width="440" height="104" rx="20" fill="#295a5b" stroke="#76dbb9"/><text x="915" y="647" fill="white" font-size="20" font-weight="700">缓存尺寸不符？先释放</text><text x="915" y="681" fill="#cdfff0" font-size="17">空缓存：分配并读取；已有缓存：覆写读取</text>
<rect x="395" y="748" width="410" height="57" rx="17" fill="#4e4b93"/><text x="600" y="784" fill="white" font-size="20" font-weight="700">将 ViewDepths 指针借给文字缓存</text></g><g fill="none" stroke="#9fbce8" stroke-width="3" marker-end="url(#a)"><path d="M600 207V237"/><path d="M310 300H285V409"/><path d="M890 300H915V409"/><path d="M915 572V593"/><path d="M695 663H600V733"/></g><text x="226" y="389" fill="#ffbecd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17">跳过</text><text x="936" y="389" fill="#a6e4d5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17">继续</text></svg>
