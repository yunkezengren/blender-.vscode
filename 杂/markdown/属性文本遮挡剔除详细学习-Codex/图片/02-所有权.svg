<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="深度纹理和文字缓存对象所有权关系">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d182e"/><stop offset="1" stop-color="#16334d"/></linearGradient><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M2 2 10 6 2 10" fill="none" stroke="#a6c7f0" stroke-width="2"/></marker></defs><rect width="1200" height="760" fill="url(#bg)"/><text x="62" y="65" fill="white" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">四种对象，两条所有权链</text><text x="62" y="98" fill="#a6c1df" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">实线 = 拥有或包含；虚线 = 借用指针；底部箭头 = 从 GPU 复制数据到 CPU</text>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif"><rect x="65" y="150" width="510" height="235" rx="22" fill="#233b73" stroke="#6d94ec" stroke-width="2"/><text x="95" y="196" fill="#d4e2ff" font-size="28" font-weight="700">overlay::Instance</text><text x="95" y="229" fill="#a9c4f8" font-size="17">由 Engine::create_instance() 创建</text><rect x="95" y="257" width="205" height="88" rx="15" fill="#345491"/><text x="118" y="291" fill="white" font-size="21" font-weight="700">State state</text><text x="118" y="321" fill="#d9e6ff" font-size="15">内嵌值成员</text><rect x="320" y="257" width="225" height="88" rx="15" fill="#345491"/><text x="340" y="291" fill="white" font-size="19" font-weight="700">ViewDepths *</text><text x="340" y="321" fill="#d9e6ff" font-size="15">text_depth_cache_</text>
<rect x="65" y="450" width="510" height="220" rx="22" fill="#174b53" stroke="#41c9c2" stroke-width="2"/><text x="95" y="493" fill="#d5fffa" font-size="27" font-weight="700">CPU 资源</text><rect x="95" y="520" width="205" height="105" rx="15" fill="#226c72"/><text x="113" y="555" fill="white" font-size="19" font-weight="700">DRWTextStore</text><text x="113" y="585" fill="#b7f7f0" font-size="15">cache_strings</text><text x="113" y="608" fill="#b7f7f0" font-size="15">depths → 借用</text><rect x="320" y="520" width="225" height="105" rx="15" fill="#226c72"/><text x="340" y="555" fill="white" font-size="19" font-weight="700">ViewDepths</text><text x="340" y="585" fill="#b7f7f0" font-size="15">w / h / depth_range</text><text x="340" y="608" fill="#b7f7f0" font-size="15">float *depths</text>
<rect x="665" y="150" width="470" height="520" rx="22" fill="#4b3262" stroke="#b577d8" stroke-width="2"/><text x="695" y="197" fill="white" font-size="27" font-weight="700">视口 / GPU 资源</text><rect x="700" y="240" width="400" height="92" rx="16" fill="#694782"/><text x="724" y="276" fill="white" font-size="21" font-weight="700">ARegion → wmDrawBuffer</text><text x="724" y="304" fill="#ead4fa" font-size="16">当前屏幕区域找到视口</text><rect x="700" y="370" width="400" height="92" rx="16" fill="#694782"/><text x="724" y="406" fill="white" font-size="21" font-weight="700">GPUViewport</text><text x="724" y="434" fill="#ead4fa" font-size="16">包含 gpu::Texture *depth_tx</text><rect x="700" y="500" width="400" height="105" rx="16" fill="#7b4b70"/><text x="724" y="539" fill="white" font-size="21" font-weight="700">GPU 深度纹理</text><text x="724" y="570" fill="#f9dbe9" font-size="16">逐像素窗口深度；视口系统管理</text></g>
<g fill="none" stroke-width="3" marker-end="url(#arr)"><path d="M198 386V502" stroke="#8eaeec"/><path d="M433 386V502" stroke="#8eaeec"/><path d="M306 572H312" stroke="#89e9dc" stroke-dasharray="8 7"/><path d="M900 335V353" stroke="#d7a4ec"/><path d="M900 465V483" stroke="#d7a4ec"/><path d="M695 560C645 560 638 565 590 565" stroke="#ffc381"/></g><text x="585" y="621" fill="#ffd5a6" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">GPU_texture_read：复制当前帧深度</text><text x="66" y="720" fill="#9cb5d2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">注意：DRWTextStore::depths 和 Instance::text_depth_cache_ 指向同一个 ViewDepths，前者不拥有它。</text></svg>
