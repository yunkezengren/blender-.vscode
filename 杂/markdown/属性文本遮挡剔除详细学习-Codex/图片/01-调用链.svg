<text x="62" y="66" fill="#f4f7ff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">从引擎创建到文字绘制</text><text x="62" y="100" fill="#a7b9dc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17">虚函数负责接入引擎生命周期，普通成员函数负责深度回读</text>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif" filter="url(#s)">
<rect x="70" y="150" width="310" height="104" rx="18" fill="#203967" stroke="#5676b5"/><text x="96" y="185" fill="#9ec1ff" font-size="16">引擎入口 · 虚函数</text><text x="96" y="220" fill="white" font-size="23" font-weight="700">Engine::create_instance()</text>
<rect x="445" y="150" width="310" height="104" rx="18" fill="#203967" stroke="#5676b5"/><text x="471" y="185" fill="#9ec1ff" font-size="16">真实对象</text><text x="471" y="220" fill="white" font-size="23" font-weight="700">new overlay::Instance()</text>
<rect x="820" y="150" width="310" height="104" rx="18" fill="#203967" stroke="#5676b5"/><text x="846" y="185" fill="#9ec1ff" font-size="16">基类指针保存</text><text x="846" y="220" fill="white" font-size="23" font-weight="700">DrawEngine *instance</text>
<rect x="70" y="332" width="310" height="104" rx="18" fill="#173f53" stroke="#42bea2"/><text x="96" y="367" fill="#83e6d2" font-size="16">虚函数分派</text><text x="96" y="402" fill="white" font-size="22" font-weight="700">init() / begin_sync()</text>
<rect x="445" y="332" width="310" height="104" rx="18" fill="#173f53" stroke="#42bea2"/><text x="471" y="367" fill="#83e6d2" font-size="16">虚函数分派</text><text x="471" y="402" fill="white" font-size="22" font-weight="700">Instance::draw()</text>
<rect x="820" y="332" width="310" height="104" rx="18" fill="#173f53" stroke="#42bea2"/><text x="846" y="367" fill="#83e6d2" font-size="16">普通成员调用</text><text x="846" y="402" fill="white" font-size="22" font-weight="700">draw_v3d()</text>
<rect x="70" y="520" width="460" height="116" rx="20" fill="url(#a)"/><text x="100" y="560" fill="#e8ecff" font-size="16">本专题：准备场景深度</text><text x="100" y="602" fill="white" font-size="26" font-weight="700">update_text_depth()</text>
