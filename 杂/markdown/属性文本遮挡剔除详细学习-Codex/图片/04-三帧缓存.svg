<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-label="视口尺寸和相机变化时 CPU 深度缓存的三帧演示">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101932"/><stop offset="1" stop-color="#242c50"/></linearGradient><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1 9 5.5 1 10" fill="none" stroke="#a9bdf1" stroke-width="2"/></marker></defs><rect width="1200" height="730" fill="url(#bg)"/><text x="58" y="65" fill="white" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">三帧故事：地址可以复用，像素必须刷新</text><text x="58" y="103" fill="#adbee6" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">每个卡片都表示一次有文字请求遮挡测试的绘制轮次</text>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif"><rect x="55" y="158" width="335" height="415" rx="22" fill="#254777" stroke="#76a6f4" stroke-width="2"/><text x="83" y="202" fill="#a8caff" font-size="18">帧 N</text><text x="83" y="245" fill="white" font-size="28" font-weight="700">相机 A</text><text x="83" y="290" fill="#e2ebff" font-size="20">视口 1000 × 800</text><path d="M83 315H359" stroke="#5f87bb"/><text x="83" y="360" fill="#b4d3ff" font-size="17">CPU 缓存此前为空</text><rect x="83" y="398" width="278" height="96" rx="14" fill="#35669d"/><text x="103" y="435" fill="white" font-size="19" font-weight="700">分配 ViewDepths + 数组</text><text x="103" y="467" fill="#d7ebff" font-size="17">三参数 read：得到 A 深度</text>
<rect x="432" y="158" width="335" height="415" rx="22" fill="#235a58" stroke="#6cd8c5" stroke-width="2"/><text x="460" y="202" fill="#9df3e1" font-size="18">帧 N+1</text><text x="460" y="245" fill="white" font-size="28" font-weight="700">相机 B</text><text x="460" y="290" fill="#e0fff8" font-size="20">视口 1000 × 800</text><path d="M460 315H736" stroke="#5ba79c"/><text x="460" y="360" fill="#b9f3e9" font-size="17">尺寸匹配，保留 CPU 数组</text><rect x="460" y="398" width="278" height="96" rx="14" fill="#32827b"/><text x="480" y="435" fill="white" font-size="19" font-weight="700">复用同一内存地址</text><text x="480" y="467" fill="#defff9" font-size="17">四参数 read：覆写为 B 深度</text>
<rect x="809" y="158" width="335" height="415" rx="22" fill="#664469" stroke="#d191d4" stroke-width="2"/><text x="837" y="202" fill="#f2c3f1" font-size="18">帧 N+2</text><text x="837" y="245" fill="white" font-size="28" font-weight="700">相机 B</text><text x="837" y="290" fill="#ffe7ff" font-size="20">视口 1200 × 800</text><path d="M837 315H1113" stroke="#a976aa"/><text x="837" y="360" fill="#f5d7f1" font-size="17">尺寸改变，旧数组不匹配</text><rect x="837" y="398" width="278" height="96" rx="14" fill="#8c5b8c"/><text x="857" y="435" fill="white" font-size="19" font-weight="700">释放后重新分配</text><text x="857" y="467" fill="#fff0ff" font-size="17">三参数 read：得到新尺寸深度</text></g><g stroke="#a9bdf1" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M393 365H418"/><path d="M770 365H795"/></g><rect x="55" y="618" width="1089" height="66" rx="16" fill="#223458"/><text x="600" y="659" text-anchor="middle" fill="#e5edff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21">反例：若帧 N+1 沿用 A 的像素内容，B 相机的锚点将与 A 相机的深度错位。</text></svg>
