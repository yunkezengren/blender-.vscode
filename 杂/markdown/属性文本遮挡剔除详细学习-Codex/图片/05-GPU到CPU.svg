<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="从 GPU 深度纹理经后端虚函数回读到 CPU 数组">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111832"/><stop offset="1" stop-color="#1c3451"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#b5cfff" stroke-width="2"/></marker></defs><rect width="1200" height="720" fill="url(#bg)"/><text x="58" y="66" fill="white" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">一次 GPU → CPU 深度回读</text><text x="58" y="101" fill="#abc1e2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">从调用外壳走到具体图形后端，再回到文字遮挡判断</text>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif"><rect x="55" y="155" width="340" height="440" rx="23" fill="#4c3769" stroke="#bd94e4" stroke-width="2"/><text x="84" y="200" fill="#e7cfff" font-size="26" font-weight="700">GPU / 视口</text><text x="84" y="249" fill="white" font-size="22">GPUViewport::depth_tx</text><text x="84" y="284" fill="#dfcaec" font-size="17">逐像素窗口深度纹理</text><g fill="#9775b0"><rect x="84" y="327" width="62" height="55" rx="8"/><rect x="158" y="327" width="62" height="55" rx="8"/><rect x="232" y="327" width="62" height="55" rx="8"/><rect x="306" y="327" width="62" height="55" rx="8"/><rect x="84" y="393" width="62" height="55" rx="8"/><rect x="158" y="393" width="62" height="55" rx="8"/><rect x="232" y="393" width="62" height="55" rx="8"/><rect x="306" y="393" width="62" height="55" rx="8"/></g><text x="84" y="510" fill="#e7cfff" font-size="17">创建时声明 HOST_READ</text><text x="84" y="543" fill="#e7cfff" font-size="17">GPU 资源由视口管理</text>
<rect x="430" y="155" width="340" height="440" rx="23" fill="#294f6c" stroke="#88c6e6" stroke-width="2"/><text x="459" y="200" fill="#c8edff" font-size="26" font-weight="700">GPU 接口 / 后端</text><text x="459" y="249" fill="white" font-size="20">GPU_texture_read(...)</text><text x="459" y="284" fill="#cee9f7" font-size="17">计算大小 / 提供目标内存</text><rect x="458" y="330" width="283" height="132" rx="15" fill="#3b7292"/><text x="478" y="370" fill="white" font-size="19" font-weight="700">texture-&gt;read(...)</text><text x="478" y="404" fill="#d9f6ff" font-size="17">gpu::Texture 的虚函数</text><text x="478" y="434" fill="#d9f6ff" font-size="16">GL / Vulkan / Metal 实现</text><text x="459" y="522" fill="#c8edff" font-size="17">可能需要等待 GPU 完成</text>
<rect x="805" y="155" width="340" height="440" rx="23" fill="#285d59" stroke="#8cdec8" stroke-width="2"/><text x="834" y="200" fill="#d6fff1" font-size="26" font-weight="700">CPU / 文字系统</text><text x="834" y="249" fill="white" font-size="21">ViewDepths::depths</text><text x="834" y="284" fill="#cff4e9" font-size="17">float 数组，可按像素索引</text><rect x="834" y="329" width="281" height="130" rx="15" fill="#398275"/><text x="854" y="368" fill="white" font-size="19" font-weight="700">depths[y * w + x]</text><text x="854" y="404" fill="#e2fff8" font-size="17">与文字锚点深度比较</text><text x="854" y="434" fill="#e2fff8" font-size="17">决定该条文字画或跳过</text><text x="834" y="522" fill="#d6fff1" font-size="17">数组由 Instance 负责释放</text></g><g fill="none" stroke="#b5cfff" stroke-width="3" marker-end="url(#a)"><path d="M396 375H418"/><path d="M772 375H793"/></g><rect x="55" y="626" width="1090" height="58" rx="15" fill="#253c5d"/><text x="600" y="662" fill="#dfeaff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" text-anchor="middle">整张回读的主要数据量随视口宽 × 高增长；复用 CPU 数组不等于免除回读。</text></svg>
