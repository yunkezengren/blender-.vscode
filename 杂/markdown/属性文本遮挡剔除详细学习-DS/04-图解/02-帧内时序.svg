<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#14181f" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="960" height="480" fill="#f7f8fa"/>
  <text x="32" y="42" font-size="21" font-weight="700" fill="#14181f">② 一帧内的时序 —— 为什么 939 行的调用点不能移动</text>
  <text x="32" y="66" font-size="13" fill="#7a8494">回读必须卡在「prepass 之后、grid/axes 之前」——此刻深度缓冲是纯场景</text>

  <g filter="url(#sh2)">
    <rect x="31" y="110" width="138" height="150" rx="12" fill="#ffffff" stroke="#e4e8ef"/>
    <rect x="183" y="110" width="138" height="150" rx="12" fill="#ffffff" stroke="#e4e8ef"/>
    <rect x="335" y="110" width="138" height="150" rx="12" fill="#ffffff" stroke="#e4e8ef"/>
    <rect x="487" y="110" width="138" height="150" rx="12" fill="#eef1fe" stroke="#4f6ef7" stroke-width="2"/>
    <rect x="639" y="110" width="138" height="150" rx="12" fill="#ffffff" stroke="#e4e8ef"/>
    <rect x="791" y="110" width="138" height="150" rx="12" fill="#ffffff" stroke="#e4e8ef"/>
  </g>

  <!-- 1 -->
  <text x="100" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14181f">begin_sync</text>
  <text x="100" y="164" text-anchor="middle" font-size="11.5" fill="#3d4756">销毁重建</text>
  <text x="100" y="182" text-anchor="middle" font-size="11.5" fill="#3d4756">DRWTextStore</text>
  <text x="100" y="200" text-anchor="middle" font-family="Consolas,monospace" font-size="10.5" fill="#7a8494">462–463 行</text>
  <rect x="76" y="222" width="48" height="20" rx="10" fill="#f1f3f8"/><text x="100" y="236" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7a8494">CPU</text>
  <!-- 2 -->
  <text x="252" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14181f">object_sync ×N</text>
  <text x="252" y="164" text-anchor="middle" font-size="11.5" fill="#3d4756">收集 .viewer 文本</text>
  <text x="252" y="182" text-anchor="middle" font-size="11.5" fill="#3d4756">打 OCCLUSION 标志</text>
  <text x="252" y="200" text-anchor="middle" font-size="10.5" fill="#7a8494">锚点前移在此发生</text>
  <rect x="228" y="222" width="48" height="20" rx="10" fill="#f1f3f8"/><text x="252" y="236" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7a8494">CPU</text>
  <!-- 3 -->
  <text x="404" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14181f">prepass</text>
  <text x="404" y="164" text-anchor="middle" font-size="11.5" fill="#3d4756">场景几何写入</text>
  <text x="404" y="182" text-anchor="middle" font-size="11.5" fill="#3d4756">depth_tx（显存）</text>
  <rect x="380" y="222" width="48" height="20" rx="10" fill="#f3effe"/><text x="404" y="236" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7c4ff7">GPU</text>
  <!-- 4 highlighted -->
  <text x="556" y="136" text-anchor="middle" font-size="14.5" font-weight="800" fill="#4f6ef7">★ update_text_depth</text>
  <text x="556" y="164" text-anchor="middle" font-size="11.5" fill="#3d4756">三态缓存回读</text>
  <text x="556" y="182" text-anchor="middle" font-size="11.5" fill="#3d4756">GPU → CPU 副本</text>
  <text x="556" y="200" text-anchor="middle" font-family="Consolas,monospace" font-size="10.5" fill="#4f6ef7">939 行调用</text>
  <rect x="524" y="222" width="64" height="20" rx="10" fill="#ffffff"/><text x="556" y="236" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4f6ef7">GPU→CPU</text>
  <!-- 5 -->
  <text x="708" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14181f">grid / axes</text>
  <text x="708" y="164" text-anchor="middle" font-size="11.5" fill="#3d4756">写单像素深度</text>
  <text x="708" y="182" text-anchor="middle" font-size="11.5" fill="#d68910">深度被污染</text>
  <rect x="684" y="222" width="48" height="20" rx="10" fill="#f3effe"/><text x="708" y="236" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7c4ff7">GPU</text>
  <!-- 6 -->
  <text x="860" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14181f">draw_text</text>
  <text x="860" y="164" text-anchor="middle" font-size="11.5" fill="#3d4756">投影 + 采样 + 比较</text>
  <text x="860" y="182" text-anchor="middle" font-size="11.5" fill="#3d4756">→ IS_CLIPPED</text>
  <rect x="836" y="222" width="48" height="20" rx="10" fill="#f1f3f8"/><text x="860" y="236" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7a8494">CPU</text>

  <g stroke="#cfd6e2" stroke-width="2" fill="none">
    <path d="M169 185 h14 m-4 -4 l4 4 l-4 4"/>
    <path d="M321 185 h14 m-4 -4 l4 4 l-4 4"/>
    <path d="M473 185 h14 m-4 -4 l4 4 l-4 4"/>
    <path d="M625 185 h14 m-4 -4 l4 4 l-4 4"/>
    <path d="M777 185 h14 m-4 -4 l4 4 l-4 4"/>
  </g>

  <rect x="335" y="290" width="290" height="34" rx="10" fill="#eef1fe" stroke="#4f6ef7" stroke-opacity=".3"/>
  <text x="351" y="312" font-size="12.5" fill="#3d4756">★ 回读 = 管线同步点，唯一昂贵步骤</text>
  <rect x="639" y="290" width="290" height="34" rx="10" fill="#fdf6e3" stroke="#d68910" stroke-opacity=".4"/>
  <text x="655" y="312" font-size="12.5" fill="#3d4756">污染无所谓——CPU 副本已经到手</text>

  <rect x="31" y="356" width="898" height="88" rx="12" fill="#ffffff" stroke="#e4e8ef"/>
  <text x="51" y="388" font-size="13.5" font-weight="700" fill="#14181f">挪动调用点的后果</text>
  <text x="51" y="412" font-size="12.5" fill="#3d4756">· 挪到 grid 之后 → 锚点落在网格线上方的文本被自己的辅助线「遮挡」，错误消失</text>
  <text x="51" y="432" font-size="12.5" fill="#3d4756">· 挪到 prepass 之前 → 读到的是上一帧残留或清空值，深度比较整体失效</text>
</svg>
