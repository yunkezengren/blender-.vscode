<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="sh5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#14181f" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="960" height="640" fill="#f7f8fa"/>
  <text x="32" y="42" font-size="21" font-weight="700" fill="#14181f">⑤ update_text_depth 流程图 —— 三道闸门 + 三态缓存</text>
  <text x="32" y="66" font-size="13" fill="#7a8494">37 行函数的完整控制流；绿色为常规帧路径，橙色为重建路径</text>

  <g filter="url(#sh5)"><rect x="330" y="88" width="300" height="44" rx="10" fill="#ffffff" stroke="#e4e8ef"/></g>
  <text x="480" y="115" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#24292f">update_text_depth()</text>

  <line x1="480" y1="132" x2="480" y2="152" stroke="#3d4756" stroke-width="1.8"/><path d="M480 152 l-5 -8 h10 z" fill="#3d4756"/>

  <!-- 闸门1 -->
  <g filter="url(#sh5)"><polygon points="480,164 700,196 480,228 260,196" fill="#ffffff" stroke="#cfd6e2" stroke-width="1.4"/></g>
  <text x="480" y="192" text-anchor="middle" font-size="12" fill="#24292f">state.show_text ？</text>
  <text x="480" y="210" text-anchor="middle" font-size="10.5" fill="#7a8494">本帧画不画文本（init() 93 行赋值）</text>
  <line x1="260" y1="196" x2="150" y2="196" stroke="#dc3545" stroke-width="1.8"/><path d="M150 196 l9 -5 v10 z" fill="#dc3545"/>
  <text x="200" y="184" text-anchor="middle" font-size="11.5" fill="#dc3545">否</text>

  <!-- 闸门2 -->
  <g filter="url(#sh5)"><polygon points="480,244 700,276 480,308 260,276" fill="#ffffff" stroke="#cfd6e2" stroke-width="1.4"/></g>
  <text x="480" y="272" text-anchor="middle" font-size="12" fill="#24292f">is_space_v3d() ？</text>
  <text x="480" y="290" text-anchor="middle" font-size="10.5" fill="#7a8494">space_type == SPACE_VIEW3D（防御）</text>
  <line x1="260" y1="276" x2="150" y2="276" stroke="#dc3545" stroke-width="1.8"/><path d="M150 276 l9 -5 v10 z" fill="#dc3545"/>
  <text x="200" y="264" text-anchor="middle" font-size="11.5" fill="#dc3545">否</text>

  <!-- 闸门3 -->
  <g filter="url(#sh5)"><polygon points="480,324 700,356 480,388 260,356" fill="#ffffff" stroke="#cfd6e2" stroke-width="1.4"/></g>
  <text x="480" y="352" text-anchor="middle" font-size="12" fill="#24292f">needs_depth_test() ？</text>
  <text x="480" y="370" text-anchor="middle" font-size="10.5" fill="#7a8494">扫描缓存：任一条带 OCCLUSION 标志</text>
  <line x1="260" y1="356" x2="150" y2="356" stroke="#dc3545" stroke-width="1.8"/><path d="M150 356 l9 -5 v10 z" fill="#dc3545"/>
  <text x="200" y="344" text-anchor="middle" font-size="11.5" fill="#dc3545">否</text>

  <!-- 早退分支 -->
  <g filter="url(#sh5)"><rect x="48" y="420" width="330" height="96" rx="12" fill="#ffffff" stroke="#dc3545" stroke-opacity=".4"/></g>
  <text x="68" y="448" font-size="12.5" font-weight="700" fill="#dc3545">早退（三处汇合）</text>
  <g font-family="Consolas,monospace" font-size="11" fill="#24292f">
    <text x="68" y="470">① depth_set(dt, nullptr)</text>
    <text x="68" y="488">② if(cache) free(cache)</text>
    <text x="68" y="506">③ cache = nullptr → return</text>
  </g>
  <text x="68" y="534" font-size="10.5" fill="#7a8494">顺序是安全契约：先摘借用再释放</text>

  <line x1="480" y1="388" x2="480" y2="408" stroke="#3d4756" stroke-width="1.8"/><path d="M480 408 l-5 -8 h10 z" fill="#3d4756"/>
  <text x="494" y="402" font-size="11.5" fill="#10a35a">三关全过</text>

  <g filter="url(#sh5)"><rect x="330" y="412" width="300" height="42" rx="10" fill="#ffffff" stroke="#e4e8ef"/></g>
  <text x="480" y="438" text-anchor="middle" font-family="Consolas,monospace" font-size="11.5" fill="#24292f">取视口 → depth_tx → 读宽高</text>

  <!-- 三态 -->
  <line x1="480" y1="454" x2="480" y2="470" stroke="#3d4756" stroke-width="1.8"/><path d="M480 470 l-5 -8 h10 z" fill="#3d4756"/>
  <g filter="url(#sh5)"><polygon points="480,474 700,502 480,530 260,502" fill="#ffffff" stroke="#cfd6e2" stroke-width="1.4"/></g>
  <text x="480" y="500" text-anchor="middle" font-size="12" fill="#24292f">缓存存在 且 宽高匹配 ？</text>
  <text x="480" y="518" text-anchor="middle" font-size="10.5" fill="#7a8494">1033–1038 行</text>

  <line x1="260" y1="502" x2="176" y2="548" stroke="#d68910" stroke-width="1.8"/><path d="M176 548 l10 -7 l2 11 z" fill="#d68910"/>
  <text x="200" y="540" font-size="11.5" fill="#d68910">否：free → 重建</text>
  <line x1="480" y1="530" x2="480" y2="548" stroke="#10a35a" stroke-width="1.8"/><path d="M480 548 l-5 -8 h10 z" fill="#10a35a"/>
  <text x="494" y="545" font-size="11.5" fill="#10a35a">是</text>

  <g filter="url(#sh5)">
    <rect x="120" y="552" width="230" height="56" rx="10" fill="#fdf6e3" stroke="#d68910" stroke-opacity=".4"/>
    <rect x="366" y="552" width="228" height="56" rx="10" fill="#e8f8ef" stroke="#10a35a" stroke-opacity=".4"/>
  </g>
  <text x="235" y="576" text-anchor="middle" font-size="12" font-weight="700" fill="#d68910">新建 / 重建</text>
  <text x="235" y="596" text-anchor="middle" font-family="Consolas,monospace" font-size="10.5" fill="#3d4756">MEM_new_zeroed + 分配版 read</text>
  <text x="480" y="576" text-anchor="middle" font-size="12" font-weight="700" fill="#10a35a">原地刷新（常规帧）</text>
  <text x="480" y="596" text-anchor="middle" font-family="Consolas,monospace" font-size="10.5" fill="#3d4756">写入版 read → depths 原缓冲</text>
</svg>
