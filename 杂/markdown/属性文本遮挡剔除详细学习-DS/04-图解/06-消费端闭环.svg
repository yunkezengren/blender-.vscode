<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="sh6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#14181f" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="960" height="470" fill="#f7f8fa"/>
  <text x="32" y="42" font-size="21" font-weight="700" fill="#14181f">⑥ 消费端闭环 —— 缓存怎么被「用掉」</text>
  <text x="32" y="66" font-size="13" fill="#7a8494">draw_manager_text.cc：投影取深度 → 采样 → bias 比较 → 透视平面重建</text>

  <g filter="url(#sh6)">
    <rect x="48" y="104" width="270" height="290" rx="12" fill="#ffffff" stroke="#e4e8ef"/>
    <rect x="345" y="104" width="270" height="290" rx="12" fill="#ffffff" stroke="#e4e8ef"/>
    <rect x="642" y="104" width="270" height="290" rx="12" fill="#ffffff" stroke="#e4e8ef"/>
  </g>

  <text x="183" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4f6ef7">① 投影时顺带取深度</text>
  <g font-family="Consolas,monospace" font-size="11" fill="#24292f">
    <text x="68" y="168">ED_view3d_project_float_ex(</text>
    <text x="68" y="186">  region, rv3d-&gt;persmat,</text>
    <text x="68" y="204">  ..., vos.vec, xy,</text>
    <text x="68" y="222">  CLIP_BB|WIN|NEAR,</text>
    <text x="68" y="240">  &amp;anchor_depth)      ←</text>
  </g>
  <text x="68" y="272" font-size="11.5" fill="#3d4756">第 2 册的投影函数，最后一个</text>
  <text x="68" y="290" font-size="11.5" fill="#3d4756">出参直接给出锚点 NDC 深度</text>
  <text x="68" y="316" font-family="Consolas,monospace" font-size="11" fill="#4f6ef7">anchor_depth ∈ [0,1]</text>
  <text x="68" y="352" font-size="10.5" fill="#7a8494">同一份投影结果同时用于</text>
  <text x="68" y="370" font-size="10.5" fill="#7a8494">屏幕定位与深度测试，零重复</text>

  <text x="480" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4f6ef7">② 采样场景深度</text>
  <g font-family="Consolas,monospace" font-size="11" fill="#24292f">
    <text x="365" y="168">x = int(xy[0]);</text>
    <text x="365" y="186">y = int(xy[1]);</text>
    <text x="365" y="210">scene_depth =</text>
    <text x="365" y="228">  dt-&gt;depths-&gt;depths[</text>
    <text x="365" y="246">    y * dt-&gt;depths-&gt;w + x];</text>
  </g>
  <text x="365" y="282" font-size="11.5" fill="#3d4756">行主序寻址公式，直接下标</text>
  <text x="365" y="300" font-size="11.5" fill="#3d4756">读取——无需 GPU，纯内存访问</text>
  <rect x="365" y="322" width="230" height="48" rx="8" fill="#eef1fe"/>
  <text x="480" y="342" text-anchor="middle" font-size="11" fill="#4f6ef7">边界先行：x/y 越界 → IS_CLIPPED</text>
  <text x="480" y="360" text-anchor="middle" font-size="10.5" fill="#7a8494">anchor_depth ≥ 1.0 亦剔除</text>

  <text x="777" y="136" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4f6ef7">③ 比较与剔除</text>
  <g font-family="Consolas,monospace" font-size="11" fill="#24292f">
    <text x="662" y="168">text_depth_is_occluded(</text>
    <text x="662" y="186">  anchor, scene) {</text>
    <text x="662" y="204">  return scene != 1.0f &amp;&amp;</text>
    <text x="662" y="222">    anchor &gt; scene + bias; }</text>
  </g>
  <text x="662" y="252" font-family="Consolas,monospace" font-size="11.5" fill="#4f6ef7">bias = 2.0e-5</text>
  <text x="662" y="274" font-size="11.5" fill="#3d4756">scene == 1.0 → 天空/远平面，</text>
  <text x="662" y="292" font-size="11.5" fill="#3d4756">背景永不遮挡文本</text>
  <rect x="662" y="312" width="230" height="60" rx="8" fill="#fdf6e3" stroke="#d68910" stroke-opacity=".35"/>
  <text x="678" y="334" font-size="11" font-weight="700" fill="#d68910">透视第二阶段</text>
  <text x="678" y="354" font-size="10.5" fill="#3d4756">3×3 邻域重建表面平面（容差 2e-6）</text>

  <g stroke="#cfd6e2" stroke-width="2" fill="none">
    <path d="M318 249 h27 m-5 -5 l5 5 l-5 5"/>
    <path d="M615 249 h27 m-5 -5 l5 5 l-5 5"/>
  </g>

  <rect x="48" y="418" width="864" height="34" rx="10" fill="#fdeced" stroke="#dc3545" stroke-opacity=".3"/>
  <text x="64" y="440" font-size="12.5" fill="#3d4756">occluded == true → vos.sco[0] = IS_CLIPPED → 本条文本整帧不绘制；平面重建正是「透视闪烁修复」提交的内容</text>
</svg>
