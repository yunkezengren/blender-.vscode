<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="sh4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#14181f" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="depthg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d4f9"/><stop offset=".5" stop-color="#eef1fe"/><stop offset="1" stop-color="#f6f7fb"/>
    </linearGradient>
  </defs>
  <rect width="960" height="580" fill="#f7f8fa"/>
  <text x="32" y="42" font-size="21" font-weight="700" fill="#14181f">④ GPU → CPU 深度回读数据流</text>
  <text x="32" y="66" font-size="13" fill="#7a8494">一次隐式管线同步，把显存里的 D32S8 深度面变成 CPU 上的 float 数组</text>

  <!-- GPU 面板 -->
  <g filter="url(#sh4)">
    <rect x="40" y="100" width="280" height="344" rx="12" fill="#ffffff" stroke="#e4e8ef"/>
  </g>
  <path d="M40 112 a12 12 0 0 1 12 -12 h256 a12 12 0 0 1 12 12 v26 h-280 z" fill="#f3effe"/>
  <text x="58" y="137" font-size="14" font-weight="700" fill="#7c4ff7">GPU 显存</text>
  <g>
    <rect x="64" y="164" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".55"/>
    <rect x="98" y="164" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".38"/>
    <rect x="132" y="164" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".22"/>
    <rect x="166" y="164" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".62"/>
    <rect x="200" y="164" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".30"/>
    <rect x="234" y="164" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".45"/>
    <rect x="64" y="198" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".25"/>
    <rect x="98" y="198" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".58"/>
    <rect x="132" y="198" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".18"/>
    <rect x="166" y="198" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".40"/>
    <rect x="200" y="198" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".52"/>
    <rect x="234" y="198" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".28"/>
    <rect x="64" y="232" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".48"/>
    <rect x="98" y="232" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".20"/>
    <rect x="132" y="232" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".66"/>
    <rect x="166" y="232" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".33"/>
    <rect x="200" y="232" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".42"/>
    <rect x="234" y="232" width="28" height="28" rx="4" fill="#7c4ff7" opacity=".24"/>
  </g>
  <text x="64" y="292" font-family="Consolas,monospace" font-size="11.5" fill="#24292f">depth_tx</text>
  <text x="64" y="314" font-size="12" fill="#3d4756">格式 SFLOAT_32_DEPTH_UINT_8（D32S8）</text>
  <text x="64" y="336" font-size="12" fill="#3d4756">5 B/px · prepass 写入 · 常驻显存</text>
  <rect x="64" y="356" width="232" height="60" rx="8" fill="#f3effe"/>
  <text x="78" y="380" font-family="Consolas,monospace" font-size="11.5" fill="#7c4ff7">GPU_TEXTURE_USAGE_HOST_READ</text>
  <text x="78" y="400" font-size="11" fill="#3d4756">创建时声明「允许 CPU 回读」，缺了直接断言</text>

  <!-- 中间同步 -->
  <text x="480" y="180" text-anchor="middle" font-size="44" font-weight="800" fill="#4f6ef7">»»</text>
  <rect x="368" y="206" width="224" height="118" rx="12" fill="#ffffff" stroke="#4f6ef7" stroke-opacity=".35"/>
  <text x="480" y="234" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14181f">隐式管线同步</text>
  <text x="480" y="258" text-anchor="middle" font-family="Consolas,monospace" font-size="10.5" fill="#3d4756">GL:  glGetTextureSubImage</text>
  <text x="480" y="276" text-anchor="middle" font-family="Consolas,monospace" font-size="10.5" fill="#3d4756">VK:  vkCmdCopyImageToBuffer + barrier</text>
  <text x="480" y="302" text-anchor="middle" font-size="11" fill="#d68910">CPU 阻塞，等待 GPU 排空在途命令</text>
  <text x="480" y="348" text-anchor="middle" font-size="11.5" fill="#7a8494">虚函数分发：Texture::read = 0</text>
  <text x="480" y="366" text-anchor="middle" font-size="11.5" fill="#7a8494">→ GLTexture / VKTexture 各自实现</text>

  <!-- CPU 面板 -->
  <g filter="url(#sh4)">
    <rect x="640" y="100" width="280" height="344" rx="12" fill="#ffffff" stroke="#e4e8ef"/>
  </g>
  <path d="M640 112 a12 12 0 0 1 12 -12 h256 a12 12 0 0 1 12 12 v26 h-280 z" fill="#eef1fe"/>
  <text x="658" y="137" font-size="14" font-weight="700" fill="#4f6ef7">CPU 内存</text>
  <g>
    <rect x="664" y="164" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".42"/>
    <rect x="698" y="164" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".30"/>
    <rect x="732" y="164" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".20"/>
    <rect x="766" y="164" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".50"/>
    <rect x="800" y="164" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".26"/>
    <rect x="834" y="164" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".36"/>
    <rect x="664" y="198" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".22"/>
    <rect x="698" y="198" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".44"/>
    <rect x="732" y="198" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".16"/>
    <rect x="766" y="198" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".34"/>
    <rect x="800" y="198" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".46"/>
    <rect x="834" y="198" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".24"/>
    <rect x="664" y="232" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".38"/>
    <rect x="698" y="232" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".18"/>
    <rect x="732" y="232" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".54"/>
    <rect x="766" y="232" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".28"/>
    <rect x="800" y="232" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".40"/>
    <rect x="834" y="232" width="28" height="28" rx="4" fill="#4f6ef7" opacity=".22"/>
  </g>
  <text x="664" y="292" font-family="Consolas,monospace" font-size="11.5" fill="#24292f">ViewDepths::depths — float*</text>
  <text x="664" y="314" font-size="12" fill="#3d4756">float × w×h · 4 B/px · 行主序</text>
  <text x="664" y="336" font-family="Consolas,monospace" font-size="11.5" fill="#4f6ef7">depths[y * w + x]</text>
  <rect x="664" y="356" width="232" height="60" rx="8" fill="#eef1fe"/>
  <text x="678" y="380" font-size="12" font-weight="700" fill="#4f6ef7">1920×1080 ≈ 7.91 MiB</text>
  <text x="678" y="400" font-size="11" fill="#3d4756">每帧至多分配一次，跨帧复用</text>

  <rect x="40" y="470" width="880" height="70" rx="12" fill="#e8f8ef" stroke="#10a35a" stroke-opacity=".3"/>
  <text x="60" y="500" font-size="13" font-weight="700" fill="#10a35a">三重保证</text>
  <text x="60" y="524" font-size="12.5" fill="#3d4756">每帧 ≤ 1 次回读 · 每 1 帧分配 ≤ 1 次 · 原地刷新路径上 depths 指针地址永不改变</text>
</svg>
